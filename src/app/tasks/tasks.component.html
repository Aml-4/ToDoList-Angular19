<section id="tasks">
<header>
    <h2>{{SelectedUserName}}'s Tasks</h2>
    <menu>
        <button (click)="AddNewTask()">Add Task</button>
    </menu>
</header>
<ul>
    @for(task of selectedUserTasks; track task.id){
        <li>
            <app-task [UserTask]="task"></app-task>
        </li>
    }
</ul>
</section>
@if (isAddingTask) {
    <app-new-task [UserId]="UserId" (cancel)="onCancelAddTask()"/>
}@else {
    
}
